spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:33306/coupon?characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 36379
      lettuce:
        pool:
          max-active: 8   # 최대 커넥션 개수
          max-idle: 8     # 대기 상태의 최대 커넥션
          min-idle: 0     # 대기 상태의 최소 커넥션

  jpa:
    hibernate:
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        default_batch_fetch_size: 128
        id.new_generator_mappings: false
        format_sql: true
        show_sql: false
        use_sql_comments: true
        hbm2ddl.auto: update
        check_nullability: true
        query.in_clause_parameter_padding: true
    open-in-view: false

coupon.datasource:
  writer:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbc-url: jdbc:mysql://localhost:33306/coupon?characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: root
    maximum-pool-size: 10
  reader:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbc-url: jdbc:mysql://localhost:33307/coupon?characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: root
    maximum-pool-size: 10

logging:
  level:
    org.hibernate.SQL: DEBUG        # 쿼리 로그 출력
    org.hibernate.orm.jdbc.bind: TRACE # 파라미터 값 출력
